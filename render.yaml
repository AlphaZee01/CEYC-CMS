# Render Blueprint — Christ Embassy LCM (Web Service)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: christ-embassy-lcm
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHURCH_NAME
        value: Christ Embassy LCM
      - key: JWT_SECRET
        generateValue: true
      # Optional — set in Render dashboard if using Supabase Auth
      - key: USE_SUPABASE_AUTH
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Optional — Render sets RENDER_EXTERNAL_URL automatically; override if needed
      - key: APP_URL
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
