# Deploy Production on every push to main (backup when Vercel Git webhooks miss a commit).
# One-time setup: GitHub repo → Settings → Secrets → Actions:
#   VERCEL_TOKEN      — Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID     — Vercel project → Settings → General (Team / User ID)
#   VERCEL_PROJECT_ID — same page (Project ID)
name: Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./
